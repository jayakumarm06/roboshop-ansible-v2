- name: disable default nodejs
  command: dnf module disable nodejs -y

- name: enable node-js 24
  command: dnf module enable nodejs:24 -y

- name: Install nodejs
  dnf:
    name: nodejs
    state: present

- name: Create roboshop system user
  user:
    name: roboshop
    create_home: false
    home: /app
    system: true
    shell: /sbin/nologin
    comment: "roboshop system user"

- name: remove existing app directory
  file:
    path: /app
    state: absent

- name: remove user.zip
  file:
    path: /tmp/user.zip
    state: absent

- name: create app directory
  file:
    path: /app
    state: directory

- name: Download user application
  get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
    dest: /tmp/user.zip

- name: unzip user
  unarchive:
    src: /tmp/user.zip
    dest: /app
    remote_src: yes

- name: Install user
  community.general.npm:
    path: /app

- name: copy user service
  template:
    src: user.service.j2
    dest: /etc/systemd/system/user.service

- name: deamon reload
  systemd_service:
    daemon_reload: true

- name: start and enable user
  service:
    name: user
    state: restarted
    enabled: yes
