- name: enable mysql 8.4
  command: dnf module enable mysql:8.4 -y

- name: Install mysql
  package:
    name: mysql-server
    state: present

- name: start and enable mysql
  service:
    name: mysqld
    state: started
    enabled: yes

- name: setup MySQL root password
  command: mysql_secure_installation --set-root-pass "{{ mysql_root_password }}"
